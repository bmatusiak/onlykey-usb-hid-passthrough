; Adafruit Feather RP2040 with USB Host (Type A) -- USB HID passthrough.
;
; Native USB port  -> PC       (TinyUSB device stack, core 0)
; Type-A host port -> OnlyKey  (Pico-PIO-USB host stack, core 1)
;
; GPIO18 gates 5V to the Type-A port, so the attached key can be power-cycled;
; the PC sees that as an unplug/replug because the device side mirrors it.
;
; Environments:
;   default    -> the real proxy. Presents the four cloned HID interfaces plus a
;                 CDC serial console (PROXY_ENABLE_CDC in src/main.cpp) for
;                 power control. Note the console shares the device's USB
;                 connection, so it disappears while VBUS is cut and returns
;                 when the key does.
;   diag       -> diagnostic build. USB config untouched, nothing is proxied;
;                 it only reports what the host port sees. Try this first when
;                 the proxy looks dead.
;   diag_trace -> diag plus TinyUSB's own enumeration trace. See below.
;
;   pio run -e diag -t upload
;   pio device monitor -e diag

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_usb_host
framework = arduino
board_build.core = earlephilhower

; PIO USB bit-bangs the host port, so the system clock must be a multiple of
; 12 MHz. The board default is 133 MHz, which is not -- this override is
; required, not a tuning knob. Pico-PIO-USB supports 120 MHz and 240 MHz.
; Verified honoured: F_CPU reaches the compiler, and the core's main() calls
; set_sys_clock_khz(F_CPU / 1000, true), bumping vreg to 1.15 V above 133 MHz.
;
; 240 MHz is REQUIRED here, not a preference. At 120 MHz the OnlyKey enumerates
; as far as SET_ADDRESS and then the control transfer never completes -- no
; status stage, no timeout, no retry, the host state machine just stalls, so no
; class driver ever binds. At 240 MHz the same device enumerates every time and
; all four HID interfaces bind. Confirmed by bisecting with `pio run -e
; diag_trace`, which prints TinyUSB's own enumeration trace.
board_build.f_cpu = 240000000L

monitor_speed = 115200

; All three builds now expose a CDC interface, so the 1200-baud touch reset
; works and uploads are automatic. If a build ever runs with PROXY_ENABLE_CDC=0,
; or the firmware has wedged, fall back to holding BOOT and tapping RESET to get
; the RPI-RP2 drive.
upload_protocol = custom
upload_command = cmd /c copy /Y "$BUILD_DIR\firmware.uf2" "D:\"

; CFG_TUD_HID must be >= PROXY_MAX_HID in src/main.cpp (4 interfaces for the
; OnlyKey: keyboard, FIDO2, raw HID, seremu).
;
; This provokes a "CFG_TUD_HID redefined" warning: the core's own
; include/tusb_config.h hardcodes it to 2 without an #ifndef guard. The warning
; is harmless -- the core's TinyUSB HID sources compile to weak stubs under
; USE_TINYUSB, and the strong implementation comes from the bundled Adafruit
; library, whose tusb_config does guard the value. Verified: _hidd_epbuf in the
; final binary is 768 bytes = 4 x 192, i.e. four instances, not two.
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_HID=4

; Adafruit TinyUSB ships inside the earlephilhower core -- listing it here
; installs a second copy that shadows the bundled one. Pico-PIO-USB is not
; bundled, and its presence is what switches tusb_config to PIO host mode
; (tusb_config_rp2040.h tests __has_include("pio_usb.h")).
;
; Both libraries now live in lib/ as vendored, PATCHED copies -- see
; lib/Pico_PIO_USB/PATCHES.md and the "vendored TinyUSB copy" section of
; README.md. lib_deps is deliberately empty: re-adding Pico PIO USB here would
; install a pristine second copy and silently undo the timeout patches that stop
; the host stack hanging forever.
lib_deps =

[env:adafruit_feather_rp2040_usb_host]

[env:diag]
build_flags =
    ${env.build_flags}
    -DPROXY_DIAG=1

; Same as diag, plus TinyUSB's own enumeration trace. This is what pinpointed
; the SET_ADDRESS stall; keep it for the next time enumeration misbehaves.
;
;   pio run -e diag_trace -t upload
;
; Three non-obvious things are needed to make that trace usable:
;
; 1. Setting CFG_TUSB_DEBUG_PRINTF does NOT work -- Adafruit's tusb_config.h
;    redefines it to log_printf unconditionally. log_printf writes to
;    SERIAL_TUSB_DEBUG, which IS #ifndef-guarded, so that is the real hook.
; 2. SERIAL_TUSB_DEBUG must NOT be a Serial object. log_printf runs in USB IRQ
;    context on rp2040, so writing to the CDC there blocks once the FIFO fills,
;    deadlocking the device stack until the board is physically replugged. It
;    points at an IRQ-safe ring buffer instead, drained from loop().
; 3. Device-stack logging must stay off, or logging the CDC transfers that carry
;    the log buries the host messages. TU_LOG0 expands to nothing, so 0 really
;    disables it. Both levels must be set together with a non-zero
;    CFG_TUSB_DEBUG, otherwise TinyUSB's lookup tables fail to compile.
[env:diag_trace]
build_flags =
    ${env.build_flags}
    -DPROXY_DIAG=1
    -DCFG_TUSB_DEBUG=2
    -DCFG_TUD_LOG_LEVEL=0
    -DCFG_TUH_LOG_LEVEL=2
    -DSERIAL_TUSB_DEBUG=g_log_ring
    -include include/log_ring.h
